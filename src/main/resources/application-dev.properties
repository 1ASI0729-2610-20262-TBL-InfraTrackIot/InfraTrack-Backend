spring.datasource.url=jdbc:mysql://${DATABASE_HOST:${DATABASE_URL:localhost}}:${DATABASE_PORT:3306}/${DATABASE_NAME:infratrack-os}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

server.port=${PORT:8080}