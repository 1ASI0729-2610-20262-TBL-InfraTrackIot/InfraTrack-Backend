# Backward-compatible alias for Render services still using SPRING_PROFILES_ACTIVE=pro
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:${DATABASE_URL:253cnj.h.filess.io}}:${DATABASE_PORT:3306}/${DATABASE_NAME:db_infratrack_remarkable}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DATABASE_USER:db_infratrack_remarkable}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}

authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
