spring.application.name=InfraTrack-web-service
spring.profiles.default=dev
 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
spring.jpa.hibernate.naming.physical-strategy=com.techtitans.infratrack.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
 
documentation.application.description=@project.description@
documentation.application.version=@project.version@
documentation.application.server-url=${API_SERVER_URL:https://infratrack-api.onrender.com}
documentation.application.local-server-url=${API_LOCAL_SERVER_URL:http://localhost:8080}
 
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7
 
spring.messages.basename=messages
spring.messages.encoding=UTF-8
 
